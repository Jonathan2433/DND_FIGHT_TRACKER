{% extends "base.html" %}
{% block content %}
<div class="inl-campaign-074">
    <h2 class="inl-campaign-075">📖 Nouvel Arc Narratif</h2>
    <p class="inl-campaign-076">Campagne : <strong>{{ campaign.name }}</strong></p>
    
    <form method="POST">
        <div class="inl-campaign-077">
            <label for="name" class="inl-campaign-044">Nom de l'arc :</label>
            <input type="text" id="name" name="name" required placeholder="Ex: Les Mines Perdues" class="inl-campaign-078">
        </div>
        
        <div class="inl-campaign-077">
            <label for="description" class="inl-campaign-044">Description :</label>
            <textarea id="description" name="description" rows="4" placeholder="Décrivez brièvement cet arc narratif..." class="inl-campaign-078"></textarea>
        </div>
        
        <div class="inl-campaign-077">
            <label for="estimated_sessions" class="inl-campaign-044">Sessions estimées :</label>
            <input type="number" id="estimated_sessions" name="estimated_sessions" value="1" min="1" class="inl-campaign-078">
        </div>
        
        <button type="submit" class="btn-primary inl-campaign-079" >
            Créer l'Arc Narratif
        </button>
    </form>
    
    <p class="inl-campaign-080">
        <a href="{{ url_for('campaign.view_campaign', campaign_id=campaign.id) }}" class="inl-campaign-081">← Retour à la campagne</a>
    </p>
</div>
{% endblock %}
