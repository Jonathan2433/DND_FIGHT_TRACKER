{% extends "base.html" %}
{% block content %}
<div class="inl-auth-001">
    <h2 class="inl-auth-002">🎲 Créer un compte</h2>
    
    <form method="POST">
        <div class="inl-auth-003">
            <label for="username" class="inl-auth-004">Nom d'utilisateur :</label>
            <input type="text" id="username" name="username" required class="inl-auth-005">
        </div>
        
        <div class="inl-auth-003">
            <label for="email" class="inl-auth-004">Email :</label>
            <input type="email" id="email" name="email" required class="inl-auth-005">
        </div>
        
        <div class="inl-auth-003">
            <label for="password" class="inl-auth-004">Mot de passe :</label>
            <input type="password" id="password" name="password" required class="inl-auth-005">
        </div>
        
        <!-- ✅ SÉCURISÉ : Seuls Joueur et MJ sont disponibles -->
        <div class="inl-auth-003">
            <label for="role" class="inl-auth-004">Rôle :</label>
            <select id="role" name="role" class="inl-auth-005">
                <option value="Joueur">Joueur</option>
                <option value="MJ">Maître du Jeu</option>
                <!-- ✅ SUPPRIMÉ : Admin n'est plus disponible -->
            </select>
        </div>
        
        <button type="submit" class="btn-primary inl-auth-006" >
            Créer mon compte
        </button>
    </form>
    
    <p class="inl-auth-007">
        Déjà un compte ? <a href="{{ url_for('auth.login') }}" class="inl-auth-008">Se connecter</a>
    </p>
</div>
{% endblock %}
