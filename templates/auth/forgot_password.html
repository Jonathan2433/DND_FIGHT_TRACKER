{% extends "base.html" %}
{% block content %}
<div class="inl-auth-001">
    <h2 class="inl-auth-002">🔐 Mot de passe oublié</h2>

    <p class="inl-auth-007">Saisissez votre nom d'utilisateur ou votre email. Si un compte existe, vous recevrez un lien de réinitialisation.</p>

    <form method="POST">
        <div class="inl-auth-003">
            <label for="username_or_email" class="inl-auth-004">Nom d'utilisateur ou Email :</label>
            <input type="text" id="username_or_email" name="username_or_email" required class="inl-auth-005" autocomplete="username">
        </div>

        <button type="submit" class="btn-primary inl-auth-006">Envoyer le lien</button>
    </form>

    <p class="inl-auth-007">
        <a href="{{ url_for('auth.login') }}" class="inl-auth-008">Retour à la connexion</a>
    </p>
</div>
{% endblock %}
