{% extends "base.html" %}
{% block content %}
<div class="inl-auth-001">
    <h2 class="inl-auth-002">🔐 Choisir un nouveau mot de passe</h2>

    <p class="inl-auth-007">Utilisez un mot de passe robuste (minimum {{ min_password_length }} caractères avec majuscule, minuscule, chiffre et symbole).</p>

    <form method="POST">
        <div class="inl-auth-003">
            <label for="password" class="inl-auth-004">Nouveau mot de passe :</label>
            <input type="password" id="password" name="password" required class="inl-auth-005" minlength="{{ min_password_length }}" autocomplete="new-password">
        </div>

        <div class="inl-auth-003">
            <label for="password_confirm" class="inl-auth-004">Confirmer le mot de passe :</label>
            <input type="password" id="password_confirm" name="password_confirm" required class="inl-auth-005" minlength="{{ min_password_length }}" autocomplete="new-password">
        </div>

        <button type="submit" class="btn-primary inl-auth-006">Réinitialiser le mot de passe</button>
    </form>

    <p class="inl-auth-007">
        <a href="{{ url_for('auth.login') }}" class="inl-auth-008">Retour à la connexion</a>
    </p>
</div>
{% endblock %}
