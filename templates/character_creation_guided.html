{% extends "base.html" %}
{% block content %}
<section class="card">
    <h1>Création de personnage (funnel JSON)</h1>
    <p>Le wizard masque les options non légales et n’affiche que ce qui est autorisé pour vos choix courants.</p>

    <form method="POST" action="{{ url_for('template.create_character_template') }}" id="guided-character-form">
        <input type="hidden" name="character_type" value="PJ">
        <input type="hidden" name="visibility_level" value="private">
        <input type="hidden" name="ability_mode" id="ability-mode-hidden" value="standard_array">
        <input type="hidden" name="ability_score_method" id="ability-score-method-hidden" value="standard_array">
        <input type="hidden" name="weapon_loadout" value="">
        <input type="hidden" name="armor_loadout" value="">
        <input type="hidden" name="class_id" id="class-id-hidden" value="">
        <input type="hidden" name="background_id" id="background-id-hidden" value="">
        <input type="hidden" name="species_id" id="species-id-hidden" value="">
        <input type="hidden" name="selected_cantrips" id="selected-cantrips-hidden" value="">
        <input type="hidden" name="selected_level_1_spells" id="selected-level-one-hidden" value="">
        <input type="hidden" name="equipment" id="equipment-hidden" value="">
        <input type="hidden" name="language_1" value="common">
        <input type="hidden" name="language_2" id="language-2-hidden" value="">
        <input type="hidden" name="language_3" id="language-3-hidden" value="">
        <input type="hidden" name="skill_proficiencies" id="skill-proficiencies-hidden" value="">
        <input type="hidden" name="feat_choices" id="feat-choices-hidden" value="">
        <input type="hidden" name="background_ability_bonus_mode" id="background-ability-bonus-mode-hidden" value="">
        <input type="hidden" name="background_ability_bonus_allocations_json" id="background-ability-bonus-allocations-hidden" value="[]">
        <div id="form-validation-errors" class="alert alert-danger" role="alert" hidden></div>

        <div class="creation-wizard">
            <ol class="creation-steps-nav" aria-label="Étapes de création" id="creation-steps-nav"></ol>
            <div id="wizard-panels"></div>
        </div>

        <template id="step-template-choose_class">
            <section class="wizard-step" data-step-id="choose_class" hidden>
                <div class="form-group">
                    <label for="class-choice">Classe</label>
                    <select id="class-choice" name="character_class" required></select>
                </div>
                <div class="form-group">
                    <h3>Gains automatiques (classe)</h3>
                    <ul id="class-auto-gains"></ul>
                    <h3>Choix à faire (classe)</h3>
                    <p class="text-muted">Sélectionnez uniquement les options qui vous intéressent. Les intitulés sont traduits et simplifiés.</p>
                    <div id="class-required-choices"></div>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" data-prev-step>Retour</button>
                    <button type="button" class="btn btn-primary" data-next-step>Continuer</button>
                </div>
            </section>
        </template>

        <template id="step-template-choose_background">
            <section class="wizard-step" data-step-id="choose_background" hidden>
                <div class="form-group">
                    <h3>Choix à faire (historique)</h3>
                    <label for="background-choice">Historique</label>
                    <select id="background-choice" name="background_choice" required></select>
                    <h3>Gains automatiques (historique)</h3>
                    <ul id="background-auto-gains"></ul>
                    <p class="text-muted">Ces choix définissent votre passé d’aventurier et vos compétences de départ.</p>
                    <div id="background-origin-feat-details"></div>
                    <div id="background-origin-feat-choices"></div>
                    <div id="background-required-choices"></div>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" data-prev-step>Retour</button>
                    <button type="button" class="btn btn-primary" data-next-step>Continuer</button>
                </div>
            </section>
        </template>

        <template id="step-template-choose_species">
            <section class="wizard-step" data-step-id="choose_species" hidden>
                <div class="form-group">
                    <h3>Choix à faire (espèce)</h3>
                    <label for="species-choice">Espèce</label>
                    <select id="species-choice" name="race" required></select>
                    <h3>Gains automatiques (espèce)</h3>
                    <ul id="species-auto-gains"></ul>
                    <p class="text-muted">Choisissez les traits demandés pour finaliser votre espèce.</p>
                    <div id="species-required-choices"></div>
                    <div id="species-origin-feat-choices"></div>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" data-prev-step>Retour</button>
                    <button type="button" class="btn btn-primary" data-next-step>Continuer</button>
                </div>
            </section>
        </template>

        <template id="step-template-assign_ability_scores">
            <section class="wizard-step" data-step-id="assign_ability_scores" hidden>
                <fieldset class="form-group">
                    <legend>Caractéristiques de base</legend>
                    <label for="ability-method">Méthode de répartition (obligatoire)</label>
                    <select id="ability-method" name="ability_score_method"></select>
                    <p class="text-muted">Conseil débutant : utilisez la méthode recommandée si vous découvrez Donjons & Dragons.</p>
                    <p id="ability-background-limits" class="text-muted"></p>
                    <div style="display:grid;grid-template-columns:repeat(3,minmax(160px,1fr));gap:8px;">
                        {% for key, label in [('force','Force'),('dexterite','Dextérité'),('constitution','Constitution'),('intelligence','Intelligence'),('sagesse','Sagesse'),('charisme','Charisme')] %}
                            <label>{{ label }}
                                <select name="{{ key }}_base" required>
                                    {% for value in [15,14,13,12,10,8] %}
                                        <option value="{{ value }}" {% if loop.first %}selected{% endif %}>{{ value }}</option>
                                    {% endfor %}
                                </select>
                            </label>
                            <input type="hidden" name="{{ key }}_bg_bonus" value="0">
                        {% endfor %}
                    </div>
                    <div id="origin-bonus-controls"></div>
                </fieldset>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" data-prev-step>Retour</button>
                    <button type="button" class="btn btn-primary" data-next-step>Continuer</button>
                </div>
            </section>
        </template>

        <template id="step-template-choose_languages">
            <section class="wizard-step" data-step-id="choose_languages" hidden>
                <fieldset class="form-group">
                    <legend>Langues</legend>
                    <p>Langue commune incluse automatiquement.</p>
                    <label for="language-2">Langue 2</label>
                    <select id="language-2" required></select>
                    <label for="language-3">Langue 3</label>
                    <select id="language-3" required></select>
                </fieldset>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" data-prev-step>Retour</button>
                    <button type="button" class="btn btn-primary" data-next-step>Continuer</button>
                </div>
            </section>
        </template>

        <template id="step-template-choose_equipment">
            <section class="wizard-step" data-step-id="choose_equipment" hidden>
                <div class="form-group">
                    <h3>Équipement de classe</h3>
                    <div id="class-equipment"></div>
                    <h3>Équipement d'historique</h3>
                    <div id="background-equipment"></div>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" data-prev-step>Retour</button>
                    <button type="button" class="btn btn-primary" data-next-step>Continuer</button>
                </div>
            </section>
        </template>

        <template id="step-template-finalize">
            <section class="wizard-step" data-step-id="finalize" hidden>
                <div class="form-group">
                    <h3>Choix des sorts</h3>
                    <p class="text-muted" id="spell-step-help">Si votre classe (ou origine) donne la magie, choisissez ici les sorts autorisés.</p>
                    <div id="spell-required-choices"></div>
                    <h3>Résumé final</h3>
                    <div id="final-summary"></div>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" data-prev-step>Retour</button>
                </div>
                <div class="form-group">
                    <label for="character-name">Nom du personnage</label>
                    <input id="character-name" name="name" required>
                    <label for="alignment">Alignement</label>
                    <select id="alignment" name="alignment">
                        <option value="Loyal Bon">Loyal Bon</option>
                        <option value="Neutre Bon">Neutre Bon</option>
                        <option value="Chaotique Bon">Chaotique Bon</option>
                        <option value="Loyal Neutre">Loyal Neutre</option>
                        <option value="Neutre" selected>Neutre</option>
                        <option value="Chaotique Neutre">Chaotique Neutre</option>
                        <option value="Loyal Mauvais">Loyal Mauvais</option>
                        <option value="Neutre Mauvais">Neutre Mauvais</option>
                        <option value="Chaotique Mauvais">Chaotique Mauvais</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button class="btn btn-secondary" type="button" id="export-character-json">Extraire (JSON)</button>
                    <button class="btn btn-primary" type="submit">Créer le personnage</button>
                </div>
            </section>
        </template>
    </form>
</section>

<script>
const rawRulesContext = {{ dnd_rules_context|tojson }};
const rulesContext = (() => {
    if (typeof rawRulesContext === 'string') {
        try {
            return JSON.parse(rawRulesContext);
        } catch (error) {
            console.error('Impossible de parser dnd_rules_context.', error);
            return {};
        }
    }
    return rawRulesContext || {};
})();
const form = document.getElementById('guided-character-form');
const stepsNav = document.getElementById('creation-steps-nav');
const wizardPanels = document.getElementById('wizard-panels');

let classChoice = null;
let backgroundChoice = null;
let speciesChoice = null;
let language2 = null;
let language3 = null;
let abilityMethod = null;
let spellHelp = null;
let exportCharacterJsonButton = null;

const hidden = {
    mode: document.getElementById('ability-mode-hidden'),
    abilityScoreMethod: document.getElementById('ability-score-method-hidden'),
    classId: document.getElementById('class-id-hidden'),
    backgroundId: document.getElementById('background-id-hidden'),
    speciesId: document.getElementById('species-id-hidden'),
    language2: document.getElementById('language-2-hidden'),
    language3: document.getElementById('language-3-hidden'),
    skills: document.getElementById('skill-proficiencies-hidden'),
    cantrips: document.getElementById('selected-cantrips-hidden'),
    spells: document.getElementById('selected-level-one-hidden'),
    equipment: document.getElementById('equipment-hidden'),
    featChoices: document.getElementById('feat-choices-hidden'),
    backgroundAbilityBonusMode: document.getElementById('background-ability-bonus-mode-hidden'),
    backgroundAbilityBonusAllocations: document.getElementById('background-ability-bonus-allocations-hidden'),
};
let abilityBonusInputs = {};

const state = {
    class_id: null,
    background_id: null,
    species_id: null,
    language_ids: [],
    ability_score_method: null,
    background_ability_bonus_mode: null,
    background_ability_bonus_allocations: [],
};
let latestPayload = null;
const SPELL_CHOICE_TYPES = new Set(['spell', 'prepared_spell', 'spellbook_entry']);

const FRIENDLY_LABELS = {
    saving_throw_proficiencies: 'Jets de sauvegarde maîtrisés',
    weapon_proficiencies: 'Maîtrises d’armes',
    armor_training: 'Maîtrises d’armures',
    features_level_1: 'Capacités de niveau 1',
    hit_die: 'Dé de vie',
    traits_level_1: 'Traits de niveau 1',
    size_options: 'Tailles possibles',
    size_choice: 'Taille du personnage',
    speed: 'Vitesse',
    skill_proficiencies: 'Compétences maîtrisées',
    origin_feat: 'Don d’origine',
    skill_proficiency: 'Compétence',
    tool_proficiency: 'Outil',
    language: 'Langue',
    spell: 'Sort',
    simple_weapons: 'Armes simples',
    martial_weapons: 'Armes martiales',
    light_armor: 'Armure légère',
    medium_armor: 'Armure intermédiaire',
    heavy_armor: 'Armure lourde',
    shields: 'Boucliers',
    standard_array: 'Valeurs standard (15, 14, 13, 12, 10, 8)',
    point_buy: 'Achat de points',
    rolling: 'Jets aléatoires',
    small: 'Petite',
    medium: 'Moyenne',
    large: 'Grande',
};

function formatValue(value) {
    if (value === null || value === undefined || value === '') {
        return '—';
    }
    if (Array.isArray(value)) {
        const rendered = value.map((entry) => formatValue(entry)).filter(Boolean);
        return rendered.length ? rendered.join(', ') : '—';
    }
    if (typeof value === 'object') {
        return value.name_fr || value.label || value.id || Object.entries(value)
            .filter(([, nested]) => nested !== null && nested !== undefined && nested !== '')
            .map(([key, nested]) => `${key}: ${formatValue(nested)}`)
            .join(' | ');
    }
    if (typeof value === 'string') {
        if (FRIENDLY_LABELS[value]) return FRIENDLY_LABELS[value];
        return value
            .replaceAll('_', ' ')
            .replace(/\b([a-z])/g, (match) => match.toUpperCase());
    }
    return String(value);
}

function formatChoiceTitle(choice) {
    if (choice.name_fr) return choice.name_fr;
    if (choice.id && FRIENDLY_LABELS[choice.id]) return FRIENDLY_LABELS[choice.id];
    if (choice.id) {
        return choice.id
            .replace(/^([a-z]+)_/, '')
            .replaceAll('_', ' ')
            .replace(/\b([a-z])/g, (match) => match.toUpperCase());
    }
    return 'Choix';
}

function setOptions(select, entries) {
    if (!select) return;
    select.innerHTML = '';
    const placeholder = document.createElement('option');
    placeholder.value = '';
    placeholder.textContent = '— Sélectionnez —';
    placeholder.disabled = true;
    placeholder.selected = true;
    select.appendChild(placeholder);
    entries.forEach((entry) => {
        const opt = document.createElement('option');
        opt.value = entry.id;
        opt.textContent = entry.label || entry.name_fr || entry.id;
        select.appendChild(opt);
    });
}

function renderList(targetId, rows) {
    const target = document.getElementById(targetId);
    if (!target) return;
    target.innerHTML = '';
    if (!rows.length) {
        target.innerHTML = '<li>Aucun gain automatique.</li>';
        return;
    }
    rows.forEach((row) => {
        const li = document.createElement('li');
        li.textContent = row;
        target.appendChild(li);
    });
}

function renderErrorMessages(errors = []) {
    const target = document.getElementById('form-validation-errors');
    if (!target) return;
    if (!errors.length) {
        target.hidden = true;
        target.innerHTML = '';
        return;
    }
    target.hidden = false;
    target.innerHTML = `
        <strong>Le formulaire contient des erreurs :</strong>
        <ul>${errors.map((error) => `<li>${error}</li>`).join('')}</ul>
    `;
}

function renderSummaryList(target, title, rows) {
    const section = document.createElement('section');
    const heading = document.createElement('h4');
    heading.textContent = title;
    section.appendChild(heading);
    const list = document.createElement('ul');
    if (!rows.length) {
        const empty = document.createElement('li');
        empty.textContent = 'Aucun élément.';
        list.appendChild(empty);
    } else {
        rows.forEach((row) => {
            const li = document.createElement('li');
            li.textContent = row;
            list.appendChild(li);
        });
    }
    section.appendChild(list);
    target.appendChild(section);
}

function renderFinalSummary(payload) {
    const target = document.getElementById('final-summary');
    if (!target) return;
    target.innerHTML = '';
    if (!payload) return;
    const classSummary = payload.class_payload?.auto_granted_summary || [];
    const backgroundSummary = payload.background_payload?.auto_granted_summary || [];
    const speciesSummary = payload.species_payload?.auto_granted_summary || [];
    const choicesSummary = [
        ...(payload.class_payload?.required_choices_summary || []),
        ...(payload.background_payload?.required_choices_summary || []),
        ...(payload.species_payload?.required_choices_summary || []),
    ];

    renderSummaryList(
        target,
        'Gains automatiques',
        [...classSummary, ...backgroundSummary, ...speciesSummary].map((entry) => `${entry.label} : ${formatValue(entry.value)}`)
    );
    renderSummaryList(
        target,
        'Choix requis',
        choicesSummary.map((entry) => `${entry.label} — ${entry.id || 'choix'} (${entry.choose})`)
    );
}

function renderChoiceBlock(choice, container, scope) {
    const block = document.createElement('div');
    block.style.marginBottom = '12px';
    block.dataset.choiceId = choice.id;
    block.dataset.scope = scope;
    block.dataset.choose = String(choice.choose || 1);
    block.dataset.required = choice.required ? '1' : '0';
    block.classList.add('choice-group');
    const title = document.createElement('p');
    const label = formatChoiceTitle(choice);
    title.textContent = `${label} — choisissez ${choice.choose}`;
    block.appendChild(title);

    const options = choice.options || [];
    options.forEach((option) => {
        const labelEl = document.createElement('label');
        labelEl.style.display = 'block';
        const input = document.createElement('input');
        input.type = 'checkbox';
        input.value = option.id || option.label || option.name_fr;
        input.dataset.optionLabel = option.label || option.name_fr || option.id;
        input.dataset.choiceId = choice.id;
        input.dataset.choiceType = choice.type;
        input.dataset.scope = scope;
        if (option.source_choice_value) {
            input.dataset.sourceChoiceValue = option.source_choice_value;
        }
        input.addEventListener('change', () => {
            const siblings = Array.from(block.querySelectorAll('input:checked'));
            if (siblings.length > (choice.choose || 1)) {
                input.checked = false;
                return;
            }
            if (choice.type === 'origin_feat' && scope === 'species') {
                const selectedOption = input.checked ? option : null;
                renderFeatChoices('species-origin-feat-choices', selectedOption?.feat_payload || {}, 'species_bonus');
            }
            syncHiddenFields();
        });
        labelEl.classList.add('builder-choice-item');
        labelEl.appendChild(input);
        labelEl.append(` ${option.label || option.name_fr || option.id}`);
        block.appendChild(labelEl);
    });
    container.appendChild(block);
}

function renderSkillChoice(choice, container, scope) { renderChoiceBlock(choice, container, scope); }
function renderToolChoice(choice, container, scope) { renderChoiceBlock(choice, container, scope); }
function renderSpellChoice(choice, container, scope) { renderChoiceBlock(choice, container, scope); }
function renderAbilityBonusChoice(choice, container, scope) { renderChoiceBlock(choice, container, scope); }
function renderOriginFeatChoice(choice, container, scope) { renderChoiceBlock(choice, container, scope); }
function renderEquipmentChoice(choice, container, scope) { renderChoiceBlock(choice, container, scope); }
function renderSizeChoice(choice, container, scope) { renderChoiceBlock(choice, container, scope); }

function renderChoiceByType(choice, container, scope) {
    const rendererByType = {
        skill_proficiency: renderSkillChoice,
        tool_proficiency: renderToolChoice,
        spell: renderSpellChoice,
        prepared_spell: renderSpellChoice,
        spellbook_entry: renderSpellChoice,
        ability_bonus: renderAbilityBonusChoice,
        origin_feat: renderOriginFeatChoice,
        equipment: renderEquipmentChoice,
        size_choice: renderSizeChoice,
    };
    const renderer = rendererByType[choice.type] || renderChoiceBlock;
    renderer(choice, container, scope);
}

function renderChoices(targetId, requiredChoices, type) {
    const target = document.getElementById(targetId);
    if (!target) return;
    target.innerHTML = '';
    if (!requiredChoices.length) {
        target.textContent = 'Aucun choix requis.';
        return;
    }
    for (const choice of requiredChoices) {
        renderChoiceByType(choice, target, type);
    }
}

function syncHiddenFields() {
    const allChecked = Array.from(form.querySelectorAll('input[data-choice-type]:checked'));
    const skillValues = allChecked
        .filter((x) => x.dataset.choiceType === 'skill_proficiency')
        .map((x) => x.dataset.optionLabel || x.value);
    hidden.skills.value = skillValues.join(', ');

    const selectedSpellInputs = allChecked.filter((x) => SPELL_CHOICE_TYPES.has(x.dataset.choiceType));
    const spellValues = selectedSpellInputs.map((x) => x.value);
    const cantripValues = selectedSpellInputs
        .filter((input) => /cantrip/i.test(input.dataset.choiceId || ''))
        .map((input) => input.value);
    const levelOneSpellValues = selectedSpellInputs
        .filter((input) => !/cantrip/i.test(input.dataset.choiceId || ''))
        .map((input) => input.value);
    hidden.cantrips.value = cantripValues.join(', ');
    hidden.spells.value = levelOneSpellValues.join(', ');

    const selectedEquipment = allChecked
        .filter((x) => x.dataset.choiceType === 'equipment')
        .map((x) => x.value);
    const selectedBundles = Array.from(form.querySelectorAll('input[data-choice-type="equipment_bundle"]:checked')).map((x) => x.value);
    hidden.equipment.value = [...selectedBundles, ...selectedEquipment].join(', ');

    const featChoices = allChecked
        .filter((x) => (x.dataset.scope || '').startsWith('feat'))
        .map((x) => ({
            scope: x.dataset.scope,
            choice_id: x.dataset.choiceId,
            choice_type: x.dataset.choiceType,
            value: x.value,
            label: x.dataset.optionLabel || x.value,
            source_choice_value: x.dataset.sourceChoiceValue || null,
        }));
    hidden.featChoices.value = JSON.stringify(featChoices);
}

function splitSpellChoices(choices = []) {
    return {
        spellChoices: choices.filter((choice) => SPELL_CHOICE_TYPES.has(choice.type)),
        nonSpellChoices: choices.filter((choice) => !SPELL_CHOICE_TYPES.has(choice.type)),
    };
}

function renderOriginFeat(payload) {
    const target = document.getElementById('background-origin-feat-details');
    if (!target) return;
    target.innerHTML = '';
    const feat = payload?.origin_feat_details || {};
    if (!feat || !Object.keys(feat).length) return;

    const title = document.createElement('h4');
    title.textContent = `Don d’origine : ${feat.name_fr || feat.name || feat.id || '—'}`;
    const desc = document.createElement('p');
    desc.classList.add('text-muted');
    desc.textContent = feat.short_description_fr || feat.short_description || feat.description_fr || feat.description || 'Description non disponible.';
    target.appendChild(title);
    target.appendChild(desc);
}

function renderFeatChoices(targetId, featPayload, scope) {
    const target = document.getElementById(targetId);
    if (!target) return;
    target.innerHTML = '';
    const choices = featPayload?.required_choices || [];
    if (!choices.length) return;

    const title = document.createElement('h4');
    title.textContent = `Sous-choix de don (${featPayload?.feat?.name_fr || featPayload?.feat?.id || 'origin feat'})`;
    target.appendChild(title);
    const body = document.createElement('div');
    body.id = `${targetId}-body`;
    target.appendChild(body);
    renderChoices(body.id, choices, `feat_${scope}`);
}

function renderEquipment(targetId, payload, scope) {
    const target = document.getElementById(targetId);
    if (!target) return;
    target.innerHTML = '';
    const options = payload?.equipment_options || [];
    if (!options.length) return;

    const title = document.createElement('h4');
    title.textContent = 'Équipement';
    target.appendChild(title);
    const subtitle = document.createElement('p');
    subtitle.classList.add('text-muted');
    subtitle.textContent = 'Choisissez 1 option d’équipement, puis complétez les choix requis.';
    target.appendChild(subtitle);

    options.forEach((option) => {
        const section = document.createElement('div');
        const bundleLabel = document.createElement('label');
        bundleLabel.classList.add('builder-choice-item');
        const bundleRadio = document.createElement('input');
        bundleRadio.type = 'radio';
        bundleRadio.name = `${scope}-equipment-bundle`;
        bundleRadio.dataset.choiceType = 'equipment_bundle';
        bundleRadio.dataset.scope = scope;
        bundleRadio.value = `${scope}:${option.label || option.id}`;
        bundleRadio.addEventListener('change', syncHiddenFields);
        bundleLabel.appendChild(bundleRadio);
        bundleLabel.append(` Option ${option.label || option.id} (ou : ${option.gold || 0} po)`);
        section.appendChild(bundleLabel);

        (option.items || []).forEach((item) => {
            const row = document.createElement('label');
            row.classList.add('builder-choice-item');
            row.style.display = 'block';
            if (item.type === 'choice_from_category') {
                const title = document.createElement('p');
                title.textContent = `Choix requis (${item.id}) - choisissez ${item.choose || 1}`;
                section.appendChild(title);
                (item.options || []).forEach((subOption) => {
                    const subRow = document.createElement('label');
                    subRow.classList.add('builder-choice-item');
                    subRow.style.display = 'block';
                    const input = document.createElement('input');
                    input.type = 'checkbox';
                    input.dataset.choiceType = 'equipment';
                    input.dataset.scope = scope;
                    input.dataset.choiceId = item.id;
                    input.dataset.choose = String(item.choose || 1);
                    input.value = subOption.label || subOption.name_fr || subOption.id;
                    input.addEventListener('change', () => {
                        const siblings = Array.from(section.querySelectorAll(`input[data-choice-id="${item.id}"]:checked`));
                        if (siblings.length > (item.choose || 1)) {
                            input.checked = false;
                            return;
                        }
                        syncHiddenFields();
                    });
                    subRow.appendChild(input);
                    subRow.append(` ${subOption.label || subOption.name_fr || subOption.id}`);
                    section.appendChild(subRow);
                });
            } else {
                row.textContent = `- ${item.label || item.name_fr || item.id}`;
                section.appendChild(row);
            }
        });

        target.appendChild(section);
    });
}

async function refreshPayload() {
    const params = new URLSearchParams({
        class_id: state.class_id || '',
        background_id: state.background_id || '',
        species_id: state.species_id || '',
        ability_score_method: state.ability_score_method || '',
        background_ability_bonus_mode: state.background_ability_bonus_mode || '',
        background_ability_bonus_allocations_json: JSON.stringify(state.background_ability_bonus_allocations || []),
    });
    state.language_ids.forEach((value) => params.append('language_ids', value));

    const res = await fetch(`{{ url_for('template.character_builder_funnel_payload') }}?${params.toString()}`);
    const payload = await res.json();
    latestPayload = payload;

    const classAuto = payload.class_payload?.automatic_gains || {};
    renderList('class-auto-gains', [
        `Jets de sauvegarde : ${formatValue(classAuto.saving_throw_proficiencies)}`,
        `Armes : ${formatValue(classAuto.weapon_proficiencies)}`,
        `Armures : ${formatValue(classAuto.armor_training)}`,
        `Capacités niveau 1 : ${formatValue(classAuto.features_level_1)}`,
    ]);
    const classChoices = splitSpellChoices(payload.class_payload?.required_choices || []);
    renderChoices('class-required-choices', classChoices.nonSpellChoices, 'class');

    const bgAuto = payload.background_payload?.automatic_gains || {};
    renderList('background-auto-gains', [
        `Compétences : ${formatValue(bgAuto.skill_proficiencies)}`,
        `Don d'origine : ${formatValue(bgAuto.origin_feat)}`,
    ]);
    const backgroundChoices = splitSpellChoices(payload.background_payload?.required_choices || []);
    renderChoices('background-required-choices', backgroundChoices.nonSpellChoices, 'background');
    renderOriginFeat(payload.background_payload || {});
    renderFeatChoices('background-origin-feat-choices', payload.background_payload?.origin_feat_payload || {}, 'background');

    const speciesAuto = payload.species_payload?.automatic_gains || {};
    renderList('species-auto-gains', [
        `Traits : ${formatValue(speciesAuto.traits_level_1)}`,
        `Tailles possibles : ${formatValue(speciesAuto.size_options)}`,
        `Vitesse : ${formatValue(speciesAuto.speed)}`,
    ]);
    const speciesChoices = splitSpellChoices(payload.species_payload?.required_choices || []);
    renderChoices('species-required-choices', speciesChoices.nonSpellChoices, 'species');
    if (!speciesChoices.nonSpellChoices.some((choice) => choice.type === 'origin_feat')) {
        const speciesFeatTarget = document.getElementById('species-origin-feat-choices');
        if (speciesFeatTarget) speciesFeatTarget.innerHTML = '';
    }

    const spellChoices = [...classChoices.spellChoices, ...backgroundChoices.spellChoices, ...speciesChoices.spellChoices];
    renderChoices('spell-required-choices', spellChoices, 'spell');
    if (spellHelp) {
        spellHelp.textContent = spellChoices.length
            ? 'Choisissez vos sorts disponibles selon votre classe/historique/espèce.'
            : 'Aucun choix de sort requis pour vos sélections actuelles.';
    }
    renderEquipment('class-equipment', payload.class_payload || {}, 'class');
    renderEquipment('background-equipment', payload.background_payload || {}, 'background');

    const languagePayload = payload.languages_payload || {};
    if (language2 && language3) {
        setOptions(language2, languagePayload.options || []);
        setOptions(language3, languagePayload.options || []);
    }

    const methods = payload.ability_payload?.methods || [];
    setOptions(abilityMethod, methods.map((m) => ({
        id: m.id,
        label: `${m.label || m.name_fr || formatValue(m.id)}${m.recommended_default ? ' (recommandée)' : ''}`,
    })));
    if (methods.length && !abilityMethod.value) {
        const recommended = methods.find((method) => method.recommended_default) || methods[0];
        abilityMethod.value = recommended.id;
        hidden.mode.value = recommended.id;
        hidden.abilityScoreMethod.value = recommended.id;
        state.ability_score_method = recommended.id;
    }
    hidden.mode.value = abilityMethod.value || 'standard_array';
    hidden.abilityScoreMethod.value = abilityMethod.value || 'standard_array';
    renderAbilityBonusControls(payload.ability_payload || {});
    const allowed = payload.ability_payload?.background_ability_score_options?.allowed || [];
    const abilityLimits = document.getElementById('ability-background-limits');
    if (abilityLimits) {
        abilityLimits.textContent =
            allowed.length ? `Bonus d'origine autorisés : ${allowed.join(', ')}` : 'Aucune contrainte de bonus d’origine.';
    }
    renderFinalSummary(payload);
    renderErrorMessages([]);
    syncHiddenFields();
}

function resetBackgroundAbilityBonuses() {
    Object.values(abilityBonusInputs).forEach((input) => { if (input) input.value = '0'; });
}

function getBackgroundBonusAllocations() {
    const mode = form.querySelector('input[name="origin_bonus_mode"]:checked')?.value || '2-1';
    if (mode === '2-1') {
        return {
            mode,
            allocations: [
                { ability: form.querySelector('#origin-plus-two')?.value || '', bonus: 2 },
                { ability: form.querySelector('#origin-plus-one')?.value || '', bonus: 1 },
            ].filter((entry) => entry.ability),
        };
    }
    const selected = Array.from(form.querySelectorAll('input[name="origin-plus-one-all"]:checked'));
    return {
        mode,
        allocations: selected.map((checkbox) => ({ ability: checkbox.value, bonus: 1 })),
    };
}

function updateOriginBonusHiddenFields() {
    resetBackgroundAbilityBonuses();
    const { mode, allocations } = getBackgroundBonusAllocations();
    if (mode === '2-1') {
        const plusTwo = allocations.find((entry) => entry.bonus === 2)?.ability;
        const plusOne = allocations.find((entry) => entry.bonus === 1)?.ability;
        if (plusTwo && abilityBonusInputs[plusTwo]) abilityBonusInputs[plusTwo].value = '2';
        if (plusOne && abilityBonusInputs[plusOne]) {
            abilityBonusInputs[plusOne].value = String((parseInt(abilityBonusInputs[plusOne].value || '0', 10) + 1));
        }
    } else {
        allocations.slice(0, 3).forEach((allocation) => {
            if (abilityBonusInputs[allocation.ability]) abilityBonusInputs[allocation.ability].value = '1';
        });
    }
    hidden.backgroundAbilityBonusMode.value = mode;
    hidden.backgroundAbilityBonusAllocations.value = JSON.stringify(allocations);
    state.background_ability_bonus_mode = mode;
    state.background_ability_bonus_allocations = allocations;
}

function renderAbilityBonusControls(abilityPayload) {
    const target = document.getElementById('origin-bonus-controls');
    target.innerHTML = '';
    resetBackgroundAbilityBonuses();
    const options = abilityPayload?.background_ability_score_options || {};
    const allowed = options.allowed || [];
    if (!allowed.length) {
        target.textContent = 'Aucun bonus d’origine configurable.';
        return;
    }
    const modeBlock = document.createElement('div');
    modeBlock.innerHTML = `
        <label><input type="radio" name="origin_bonus_mode" value="2-1" checked> Bonus +2 / +1</label>
        <label style="margin-left:12px;"><input type="radio" name="origin_bonus_mode" value="1-1-1"> Bonus +1 / +1 / +1</label>
    `;
    target.appendChild(modeBlock);
    const selectors = document.createElement('div');
    selectors.id = 'origin-bonus-selectors';
    selectors.style.marginTop = '8px';
    target.appendChild(selectors);

    const renderSelectors = () => {
        selectors.innerHTML = '';
        const mode = form.querySelector('input[name="origin_bonus_mode"]:checked')?.value || '2-1';
        if (mode === '2-1') {
            selectors.innerHTML = `
                <label>Capacité +2 <select id="origin-plus-two"></select></label>
                <label style="margin-left:12px;">Capacité +1 <select id="origin-plus-one"></select></label>
            `;
            const entries = allowed.map((entry) => ({ id: entry, label: formatValue(entry) }));
            setOptions(selectors.querySelector('#origin-plus-two'), entries);
            setOptions(selectors.querySelector('#origin-plus-one'), entries);
        } else {
            const legend = document.createElement('p');
            legend.textContent = 'Choisissez 3 capacités distinctes (+1 chacune)';
            selectors.appendChild(legend);
            allowed.forEach((abilityId) => {
                const label = document.createElement('label');
                label.style.display = 'block';
                label.innerHTML = `<input type="checkbox" name="origin-plus-one-all" value="${abilityId}"> ${formatValue(abilityId)}`;
                selectors.appendChild(label);
            });
        }
        updateOriginBonusHiddenFields();
    };
    modeBlock.querySelectorAll('input[name="origin_bonus_mode"]').forEach((radio) => radio.addEventListener('change', renderSelectors));
    selectors.addEventListener('change', updateOriginBonusHiddenFields);
    renderSelectors();
}

const STEP_COMPONENTS = {
    choose_class: () => document.getElementById('step-template-choose_class')?.content.cloneNode(true),
    choose_background: () => document.getElementById('step-template-choose_background')?.content.cloneNode(true),
    choose_species: () => document.getElementById('step-template-choose_species')?.content.cloneNode(true),
    choose_languages: () => document.getElementById('step-template-choose_languages')?.content.cloneNode(true),
    assign_ability_scores: () => document.getElementById('step-template-assign_ability_scores')?.content.cloneNode(true),
    choose_equipment: () => document.getElementById('step-template-choose_equipment')?.content.cloneNode(true),
    finalize: () => document.getElementById('step-template-finalize')?.content.cloneNode(true),
};

function syncStateFromUI() {
    state.class_id = classChoice.value || null;
    state.background_id = backgroundChoice.value || null;
    state.species_id = speciesChoice.value || null;
    state.language_ids = [language2.value, language3.value].filter(Boolean);
    state.ability_score_method = abilityMethod.value || null;
    hidden.classId.value = state.class_id || '';
    hidden.backgroundId.value = state.background_id || '';
    hidden.speciesId.value = state.species_id || '';
}

function bindStepElements() {
    classChoice = document.getElementById('class-choice');
    backgroundChoice = document.getElementById('background-choice');
    speciesChoice = document.getElementById('species-choice');
    language2 = document.getElementById('language-2');
    language3 = document.getElementById('language-3');
    abilityMethod = document.getElementById('ability-method');
    spellHelp = document.getElementById('spell-step-help');
    exportCharacterJsonButton = document.getElementById('export-character-json');
    abilityBonusInputs = Object.fromEntries(
        ['force', 'dexterite', 'constitution', 'intelligence', 'sagesse', 'charisme'].map((key) => [key, form.querySelector(`input[name="${key}_bg_bonus"]`)])
    );
}

function bindWizardEvents() {
    [classChoice, backgroundChoice, speciesChoice].forEach((el) => {
        if (!el) return;
        el.addEventListener('change', async () => { syncStateFromUI(); await refreshPayload(); });
    });

    [language2, language3].forEach((el) => {
        if (!el) return;
        el.addEventListener('change', () => {
            hidden.language2.value = language2?.value || '';
            hidden.language3.value = language3?.value || '';
            syncStateFromUI();
        });
    });

    abilityMethod?.addEventListener('change', () => { hidden.mode.value = abilityMethod.value; });
    exportCharacterJsonButton?.addEventListener('click', downloadCharacterExport);

    form.querySelectorAll('[data-next-step]').forEach((button) => {
        button.addEventListener('click', () => {
            const visibleSteps = getVisibleSteps();
            const index = visibleSteps.indexOf(currentStep);
            const next = visibleSteps[index + 1];
            if (next) renderStep(next);
        });
    });
    abilityMethod?.addEventListener('change', () => {
        hidden.mode.value = abilityMethod.value;
        hidden.abilityScoreMethod.value = abilityMethod.value;
        state.ability_score_method = abilityMethod.value || null;
    });
}

function renderWizardPanels(effectiveSteps) {
    wizardPanels.innerHTML = '';
    effectiveSteps.forEach((stepId) => {
        const factory = STEP_COMPONENTS[stepId];
        if (!factory) return;
        const fragment = factory();
        if (fragment) wizardPanels.appendChild(fragment);
    });
}

function getAllowedBackgroundBonusModes(abilityOptions = {}) {
    const allocationModes = Array.isArray(abilityOptions.allocation_modes) ? abilityOptions.allocation_modes : [];
    if (allocationModes.length) return new Set(allocationModes);
    const increaseRule = abilityOptions.increase_rule || '';
    if (increaseRule.includes('increase_one_by_2_and_one_by_1')) {
        return new Set(['increase_one_by_2_and_one_by_1', 'increase_all_three_by_1']);
    }
    return new Set();
}

function validateBeforeSubmit(payload, currentState) {
    const errors = [];
    const choiceLabelById = new Map(
        [
            ...(payload?.class_payload?.required_choices_summary || []),
            ...(payload?.background_payload?.required_choices_summary || []),
            ...(payload?.species_payload?.required_choices_summary || []),
        ].map((entry) => [String(entry.id || ''), entry.label || entry.id || 'choix'])
    );
    const requiredGroups = Array.from(form.querySelectorAll('.choice-group[data-required="1"]'));
    requiredGroups.forEach((group) => {
        const choose = Number(group.dataset.choose || '1');
        const checkedInputs = Array.from(group.querySelectorAll('input[data-choice-id]:checked'));
        const choiceId = String(group.dataset.choiceId || '');
        const choiceLabel = choiceLabelById.get(choiceId) || formatChoiceTitle({ id: choiceId });
        if (checkedInputs.length !== choose) {
            errors.push(`Choix incomplet — ${choiceLabel} (${checkedInputs.length}/${choose}).`);
        }
        const inputType = group.querySelector('input[data-choice-type]')?.dataset.choiceType || '';
        if (SPELL_CHOICE_TYPES.has(inputType) && checkedInputs.length !== choose) {
            errors.push(`Sorts invalides — ${choiceId} (${checkedInputs.length}/${choose}).`);
        }
    });

    const abilityOptions = payload?.ability_payload?.background_ability_score_options || {};
    const allowedAbilities = new Set((abilityOptions.allowed || []).map((value) => String(value)));
    const allowedModes = getAllowedBackgroundBonusModes(abilityOptions);
    const { mode, allocations } = getBackgroundBonusAllocations();
    const canonicalMode = mode === '2-1' ? 'increase_one_by_2_and_one_by_1' : 'increase_all_three_by_1';
    if (allowedModes.size && !allowedModes.has(canonicalMode)) {
        errors.push('Bonus d’origine invalide : le mode sélectionné n’est pas autorisé pour ce background.');
    }
    if (allocations.some((entry) => !allowedAbilities.has(entry.ability))) {
        errors.push('Bonus d’origine invalide : certaines capacités choisies ne sont pas autorisées.');
    }
    const abilityKeys = allocations.map((entry) => entry.ability);
    const uniqueAbilityCount = new Set(abilityKeys).size;
    if (mode === '2-1') {
        const bonuses = allocations.map((entry) => Number(entry.bonus)).sort((a, b) => b - a);
        if (!(bonuses.length === 2 && bonuses[0] === 2 && bonuses[1] === 1 && uniqueAbilityCount === 2)) {
            errors.push('Bonus d’origine invalide : le mode +2/+1 exige 2 capacités distinctes (+2 et +1).');
        }
    } else if (!(allocations.length === 3 && allocations.every((entry) => Number(entry.bonus) === 1) && uniqueAbilityCount === 3)) {
        errors.push('Bonus d’origine invalide : le mode +1/+1/+1 exige 3 capacités distinctes.');
    }

    const equipmentChoiceGroups = Array.from(form.querySelectorAll('input[data-choice-type="equipment_bundle"]:checked'))
        .map((bundle) => bundle.closest('div'))
        .filter(Boolean);
    equipmentChoiceGroups.forEach((group) => {
        const choiceIds = [...new Set(Array.from(group.querySelectorAll('input[data-choice-type="equipment"]')).map((input) => input.dataset.choiceId))];
        choiceIds.forEach((choiceId) => {
            const choiceInputs = Array.from(group.querySelectorAll(`input[data-choice-type="equipment"][data-choice-id="${choiceId}"]`));
            const choose = Number(choiceInputs[0]?.dataset.choose || '1');
            const selected = choiceInputs.filter((input) => input.checked).length;
            if (selected !== choose) {
                errors.push(`Équipement incomplet : ${choiceId} (${selected}/${choose}).`);
            }
        });
    });
    if ((hidden.equipment.value || '').includes('undefined')) {
        errors.push("Équipement invalide : un placeholder d'équipement n'a pas été résolu.");
    }
    if (!currentState.ability_score_method) {
        errors.push('Méthode de caractéristiques obligatoire.');
    }
    return { ok: errors.length === 0, errors };
}

form.addEventListener('submit', (event) => {
    syncStateFromUI();
    updateOriginBonusHiddenFields();
    syncHiddenFields();
    const validationResult = validateBeforeSubmit(latestPayload || {}, state);
    if (!validationResult.ok) {
        event.preventDefault();
        renderErrorMessages(validationResult.errors);
        return;
    }
    renderErrorMessages([]);
    if (!language2?.value || !language3?.value || language2.value === language3.value) {
        event.preventDefault();
        renderErrorMessages(['Veuillez choisir 2 langues différentes en plus de Common.']);
        return;
    }
    hidden.language2.value = language2.value;
    hidden.language3.value = language3.value;
    hidden.mode.value = abilityMethod.value || 'standard_array';
    hidden.abilityScoreMethod.value = abilityMethod.value || 'standard_array';
});

let stepOrder = [];
let currentStep = null;

function getVisibleSteps() {
    return stepOrder.filter((stepId) => Boolean(form.querySelector(`.wizard-step[data-step-id="${stepId}"]`)));
}

function renderStep(stepId) {
    const visibleSteps = getVisibleSteps();
    const safeStep = visibleSteps.includes(stepId) ? stepId : (visibleSteps[0] || null);
    currentStep = safeStep;
    const stepPanels = Array.from(form.querySelectorAll('.wizard-step'));
    stepPanels.forEach((panel) => {
        const active = panel.dataset.stepId === safeStep;
        panel.hidden = !active;
        panel.classList.toggle('is-active', active);
    });

    const stepItems = Array.from(form.querySelectorAll('.creation-steps-nav li'));
    stepItems.forEach((item) => {
        const active = item.dataset.stepId === safeStep;
        const idx = visibleSteps.indexOf(item.dataset.stepId);
        const currentIdx = visibleSteps.indexOf(safeStep);
        item.classList.toggle('is-active', active);
        item.classList.toggle('is-complete', idx > -1 && idx < currentIdx);
        const trigger = item.querySelector('.creation-step-trigger');
        if (trigger) trigger.setAttribute('aria-current', active ? 'step' : 'false');
    });
}

function sanitizeFileName(value) {
    return (value || 'personnage')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-zA-Z0-9_-]+/g, '-')
        .replace(/^-+|-+$/g, '')
        .toLowerCase() || 'personnage';
}

function buildCharacterExportPayload() {
    syncHiddenFields();
    hidden.language2.value = language2.value;
    hidden.language3.value = language3.value;
    hidden.mode.value = abilityMethod.value || 'standard_array';

    const formData = new FormData(form);
    const payload = {};
    for (const [key, value] of formData.entries()) {
        if (Object.prototype.hasOwnProperty.call(payload, key)) {
            if (!Array.isArray(payload[key])) payload[key] = [payload[key]];
            payload[key].push(value);
            continue;
        }
        payload[key] = value;
    }

    return {
        exported_at: new Date().toISOString(),
        state_snapshot: { ...state },
        character_form_payload: payload,
    };
}

function downloadCharacterExport() {
    if (!language2?.value || !language3?.value || language2.value === language3.value) {
        alert('Veuillez choisir 2 langues différentes en plus de Common avant extraction.');
        return;
    }

    const exportPayload = buildCharacterExportPayload();
    const characterName = form.querySelector('[name="name"]')?.value || 'personnage';
    const safeName = sanitizeFileName(characterName);
    const blob = new Blob([JSON.stringify(exportPayload, null, 2)], { type: 'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement('a');
    anchor.href = url;
    anchor.download = `${safeName}-builder-export.json`;
    document.body.appendChild(anchor);
    anchor.click();
    document.body.removeChild(anchor);
    URL.revokeObjectURL(url);
}

function renderWizardNav(effectiveSteps) {
    stepsNav.innerHTML = '';
    effectiveSteps.forEach((stepId, index) => {
        const meta = (rulesContext.steps || []).find((entry) => (entry.id || entry) === stepId) || {};
        const li = document.createElement('li');
        li.dataset.stepId = stepId;
        if (index === 0) li.classList.add('is-active');
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'creation-step-trigger';
        button.textContent = `${index + 1}. ${meta.label || meta.name_fr || meta.name_en || stepId}`;
        button.addEventListener('click', () => renderStep(stepId));
        li.appendChild(button);
        stepsNav.appendChild(li);
    });
}

const effectiveSteps = (Array.isArray(rulesContext.steps) ? rulesContext.steps : [])
    .map((stepEntry) => stepEntry.id || stepEntry)
    .filter((stepId) => Boolean(STEP_COMPONENTS[stepId]));
renderWizardNav(effectiveSteps);
renderWizardPanels(effectiveSteps);
stepOrder = effectiveSteps;
bindStepElements();
bindWizardEvents();
setOptions(classChoice, rulesContext.classes || []);
setOptions(backgroundChoice, rulesContext.backgrounds || []);
setOptions(speciesChoice, rulesContext.species || []);
syncStateFromUI();
refreshPayload();
renderStep(stepOrder[0] || 'choose_class');
</script>
