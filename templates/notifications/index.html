{% extends "base.html" %}

{% block title %}Notifications - ExalQuest{% endblock %}

{% block content %}
<div class="card notifications-page">
    <div class="notifications-page__header">
        <h1 aria-label="Notifications">🔔</h1>
        <div class="notifications-page__actions">
            <form method="POST" action="{{ url_for('notification.mark_all_read') }}" class="notifications-page__mark-all">
                <button type="submit" class="btn btn-secondary">Marquer tout comme lu</button>
            </form>
            <form method="POST" action="{{ url_for('notification.clear_all') }}" class="notifications-page__clear-all">
                <button type="submit" class="btn btn-danger">Tout effacer</button>
            </form>
        </div>
    </div>

    {% if notifications %}
        <div class="notifications-grid">
            {% for notif in notifications %}
                <form method="POST" action="{{ url_for('notification.open_notification', notification_id=notif.id) }}" class="notification-card-form">
                    <button type="submit" class="notification-card {% if not notif.is_read %}is-unread{% endif %}">
                        <span class="notification-card__title">{{ notif.title }}</span>
                        <span class="notification-card__message">{{ notif.message }}</span>
                        <span class="notification-card__meta">
                            {{ notif.created_at.strftime('%d/%m/%Y %H:%M') }}
                            {% if not notif.is_read %}
                                · <strong>Non lue</strong>
                            {% endif %}
                        </span>
                        <span class="notification-card__cta">Voir la source →</span>
                    </button>
                </form>
            {% endfor %}
        </div>
    {% else %}
        <p class="notifications-page__empty">Aucune notification pour le moment.</p>
    {% endif %}
</div>
{% endblock %}
