{% extends "base.html" %}
{% block content %}
<div class="inl-campaign-004">
    <h1 class="inl-campaign-002">Parametres de la campagne</h1>
    <h2 class="inl-campaign-033">{{ campaign.name }}</h2>

    <form method="POST" action="{{ url_for('campaign.update_campaign', campaign_id=campaign.id) }}" class="inl-campaign-042">
        <div class="inl-campaign-043">
            <label class="inl-campaign-044">Nom</label>
            <input class="inl-campaign-078" type="text" name="name" value="{{ campaign.name }}" required>
        </div>

        <div class="inl-campaign-043">
            <label class="inl-campaign-044">Description</label>
            <textarea class="inl-campaign-078" name="description" rows="4">{{ campaign.description or '' }}</textarea>
        </div>

        <div class="inl-campaign-043">
            <label class="inl-campaign-044">
                <input type="checkbox" name="is_public" {% if campaign.is_public %}checked{% endif %}>
                Campagne publique
            </label>
        </div>

        <div class="inl-campaign-020">
            <button type="submit" class="btn btn-primary">Enregistrer</button>
            <a href="{{ url_for('campaign.view_campaign', campaign_id=campaign.id) }}" class="btn btn-secondary">Retour</a>
        </div>
    </form>

    <div class="inl-campaign-041">
        <h3 class="inl-campaign-033">Membres</h3>
        {% for member in members %}
            <div class="inl-campaign-047">
                <span>{{ member.user.username }}</span>
                {% if member.user_id != campaign.mj_id %}
                    <form method="POST" action="{{ url_for('campaign.remove_member', campaign_id=campaign.id, user_id=member.user_id) }}">
                        <button class="btn btn-danger" type="submit">Retirer</button>
                    </form>
                {% else %}
                    <span class="inl-campaign-044">MJ</span>
                {% endif %}
            </div>
        {% endfor %}
    </div>

    <div class="inl-campaign-041">
        <h3 class="inl-campaign-033">Zone dangereuse</h3>
        <form method="POST" action="{{ url_for('campaign.delete_campaign', campaign_id=campaign.id) }}" onsubmit="return confirm('Supprimer definitivement cette campagne ?');">
            <button class="btn btn-danger" type="submit">Supprimer la campagne</button>
        </form>
    </div>
</div>
{% endblock %}
