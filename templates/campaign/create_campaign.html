<!-- templates/campaign/create_campaign.html - AJOUT CHECKBOX -->
{% extends "base.html" %}
{% block content %}

<div class="container">
    <h1>🎲 Créer une Campagne</h1>

    <form method="POST" class="campaign-form">
        <div class="form-section">
            <h4>📝 Informations de base</h4>
            <label for="name">Nom de la campagne :</label>
            <input type="text" name="name" id="name" required>

            <label for="description">Description :</label>
            <textarea name="description" id="description" rows="4"></textarea>
        </div>

        <!-- ✅ AJOUT SECTION VISIBILITÉ -->
        <div class="form-section">
            <h4>🔓 Visibilité de la campagne</h4>
            <label class="checkbox-label">
                <input type="checkbox" name="is_public" value="true">
                <span class="checkmark"></span>
                Campagne publique (les joueurs peuvent demander à rejoindre)
            </label>
            <p class="help-text">
                ⚠️ Si non cochée, seul le MJ peut inviter des joueurs directement.
            </p>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">🎲 Créer la Campagne</button>
            <a href="{{ url_for('main.index') }}" class="btn btn-secondary">← Annuler</a>
        </div>
    </form>
</div>


{% endblock %}
